version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    labels: [dependabot, cargo]
    schedule:
      interval: weekly
    groups:
      cargo:
        applies-to: version-updates
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    labels: [dependabot, actions]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    labels: [dependabot, docker]
    schedule:
      interval: weekly