name: Auto-merge dependabot PRs

# Merges dependabot PRs once their CI run succeeds. Triggered by the CI
# workflow's completion (workflow_run), so the merge attempt only ever
# happens after the PR's checks are green. Dependabot PRs are identified by
# author (labels from dependabot.yml are also applied when they exist, but
# dependabot opens PRs unlabeled if the repo is missing them).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only successful CI runs that came from a pull request can merge.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the green dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh pr list --repo "$REPO" --state open \
            --json number,headRefOid,author \
            --jq '.[] | select(.headRefOid == env.HEAD_SHA and (.author.login == "app/dependabot" or .author.login == "dependabot[bot]")) | .number' \
            | head -n 1)"
          if [[ -z "$pr_number" ]]; then
            echo "No open dependabot PR matches head sha $HEAD_SHA — nothing to merge."
            exit 0
          fi
          echo "Merging PR #$pr_number (CI green, authored by dependabot)."
          if ! gh pr merge --repo "$REPO" "$pr_number" --squash --delete-branch; then
            echo "Direct merge failed — retrying with auto-merge (the default token"
            echo "cannot push merges for PRs that modify workflow files; GitHub's"
            echo "auto-merge performs those)."
            gh pr merge --repo "$REPO" "$pr_number" --squash --delete-branch --auto
          fi